<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sayfa bulunamadı · Stryde</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/stryde/img/logo.png">
<style>
  @font-face { font-family: "Bricolage Grotesque"; font-style: normal; font-weight: 400 800; font-stretch: 100%; font-display: swap;
    src: url(/stryde/fonts/bricolage-latin-ext.woff2) format("woff2"); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  @font-face { font-family: "Bricolage Grotesque"; font-style: normal; font-weight: 400 800; font-stretch: 100%; font-display: swap;
    src: url(/stryde/fonts/bricolage-latin.woff2) format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  :root { --paper: #fff; --ink: #000; --graphite: #595959; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --paper: #000; --ink: #fff; --graphite: #a6a6a6; } }
  body { margin: 0; min-height: 100vh; display: grid; align-content: center; padding: 24px clamp(20px, 5vw, 72px); background: var(--paper); color: var(--ink); font-family: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif; }
  h1 { font-size: clamp(46px, 9vw, 124px); line-height: .92; letter-spacing: -.045em; font-weight: 800; margin: 0 0 24px; max-width: 12ch; }
  p { font-size: 20px; color: var(--graphite); margin: 0 0 28px; }
  a { display: inline-block; background: var(--ink); color: var(--paper); text-decoration: none; font-weight: 600; font-size: 17px; padding: 14px 22px; border-radius: 4px; justify-self: start; }
  a:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
</style>
</head>
<body>
  <h1>Bu sayfa yok.</h1>
  <p>Adres yanlış yazılmış ya da sayfa taşınmış olabilir.</p>
  <a href="/stryde/">Stryde'ın ana sayfasına git</a>
</body>
</html>
