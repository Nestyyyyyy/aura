<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sayfa bulunamadı · Aura</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/aura/img/logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap">
<style>
  :root { --paper: #fff; --ink: #000; --graphite: #595959; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --paper: #000; --ink: #fff; --graphite: #a6a6a6; } }
  body { margin: 0; min-height: 100vh; display: grid; align-content: center; padding: 24px clamp(20px, 5vw, 72px); background: var(--paper); color: var(--ink); font-family: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif; }
  h1 { font-size: clamp(46px, 9vw, 124px); line-height: .92; letter-spacing: -.045em; font-weight: 800; margin: 0 0 24px; max-width: 12ch; }
  p { font-size: 20px; color: var(--graphite); margin: 0 0 28px; }
  a { display: inline-block; background: var(--ink); color: var(--paper); text-decoration: none; font-weight: 600; font-size: 17px; padding: 14px 22px; border-radius: 4px; justify-self: start; }
  a:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
</style>
</head>
<body>
  <h1>Bu sayfa yok.</h1>
  <p>Adres yanlış yazılmış ya da sayfa taşınmış olabilir.</p>
  <a href="/aura/">Aura'nın ana sayfasına git</a>
</body>
</html>
